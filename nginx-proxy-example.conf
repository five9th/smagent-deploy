# Reverse proxy example for TLS termination in front of the SMAgent container
# (assumes the default compose port mapping 127.0.0.1:8080 -> container 8080).
#
# KEY RULE: forward the path WITHOUT stripping it — the app inside routes on
# its base path (/myapp here). proxy_pass must therefore have NO URI part.
#
# Wire into an existing server { ... } block (e.g. your certbot-managed one),
# or use as a starting point for a dedicated vhost.

# --- app under a sub-path (https://example.com/myapp/...) ---
location /myapp/ {
    proxy_pass http://127.0.0.1:8080;          # no trailing URI -> no rewrite
    proxy_set_header Host $host;               # app sees its real host
    proxy_set_header X-Forwarded-Proto $scheme;# app detects https
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 10m;
}

