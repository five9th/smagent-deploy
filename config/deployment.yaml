# SMAgent — optional deployment configuration.
#
# The compose file mounts this directory at /opt/smagent/config (read-only);
# the backend imports this file at startup if present. Uncomment only what
# you want to change — everything else keeps its built-in default, and
# environment variables set in compose.yaml always WIN over this file.
#
# IMPORTANT: do not set the app's base URL here (smagent.base-url). Use the
# APP_BASE_URL environment variable in compose.yaml — the container derives
# the SPA's routing, CORS origin and cookie settings from it. Setting it here
# desynchronizes those from the backend's OAuth redirects.

#smagent:
