# SMAgent — optional secrets configuration.
#
# The compose file mounts this directory at /opt/smagent/config (read-only);
# the backend imports this file at startup if present. Prefer environment
# variables in compose.yaml where a variable exists (they win over this
# file); use this file for values env vars can't express.
#
# The container auto-generates on first start (and stores in the data
# volume): the H2 database credentials and the initial owner password — you
# only need the entries below when re-using resources created outside this
# container, or when a value must be an EMPTY string (an empty env var means
# "not set" to the entrypoint).

#spring:
#  datasource:
#    # For an H2 database created outside this container (its own
#    # credentials). Note: an empty password can only be expressed here.
#    username: sa
#    password: ""
#
#smagent:
#  security:
#    # Base64 of exactly 32 bytes. If unset, a key file is generated in the
#    # data volume. If you set it, back it up — losing it loses all stored
#    # platform credentials. (Same as SMAGENT_ENCRYPTION_KEY env var.)
#    encryption-key: ""
#
#  facebook:
#    client-id: ""
#    client-secret: ""
#
#  linkedin:
#    client-id: ""
#    client-secret: ""
#
#  x:
#    client-id: ""
#    client-secret: ""
